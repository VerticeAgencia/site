<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | Vértice</title>
<meta name="robots" content="noindex, nofollow">
<style>
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 0,#3a1a8a55,#07050f 70%) #07050f;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
h1{font-size:clamp(2rem,6vw,3.2rem);margin:0 0 12px;text-transform:uppercase;letter-spacing:-.01em}
p{color:#bbb5d4;margin:0 0 28px}
a{display:inline-block;padding:16px 32px;background:linear-gradient(135deg,#9d6bff,#4c1d95);color:#fff;text-decoration:none;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.85rem}
a:focus-visible{outline:2px solid #a78bfa;outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>Página não encontrada</h1>
<p>O endereço que você abriu não existe.</p>
<a id="voltar" href="/">Voltar ao início</a>
</main>
<script>
(function(){var l=location,h='/';if(/\.github\.io$/.test(l.hostname)){var s=l.pathname.split('/')[1];if(s)h='/'+s+'/';}document.getElementById('voltar').href=h;})();
</script>
</body>
</html>
